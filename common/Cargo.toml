[package]
name = "eld-common"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared types, transaction wire format, and validation for Eld"
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/eldnetwork/eld-chain"
documentation = "https://docs.rs/eld-common"
keywords = ["blockchain", "tendermint", "cosmos"]
categories = ["cryptocurrency", "encoding"]
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "TYPE_DESIGN.md",
    "CHANGELOG.md",
]
publish = false

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
num-traits = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tendermint.workspace = true
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8"] }
base64.workspace = true
bincode.workspace = true
serde-big-array = "0.5.1"
abci-rs.workspace = true
parity-scale-codec = { features = ["derive"], version = "1.3" }
static_assertions = "1.1.0"
byteorder = "1.5.0"
hex = { workspace = true, features = ["serde"] }
tracing = { workspace = true, features = ["std", "attributes"] }
rand.workspace = true
sha2.workspace = true
blake3.workspace = true
serde_with = { version = "3.12.0", features = ["hex"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
