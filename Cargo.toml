[workspace]
resolver = "2"
members = ["common", "client", "node_app", "cli"]
default-members = ["common", "client", "node_app", "cli"]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/eldnetwork/eld-chain"
authors = ["Gunnar H. Karlsson <gunnar.h.karlsson@gmail.com>"]

# Version pins for crates used by more than one member.
# Features stay on the member that needs them.
[workspace.dependencies]
abci-rs = "0.11.3"
base64 = "0.22.1"
bincode = "1.3.3"
blake3 = "1.5"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
rand = "0.9.0"
reqwest = "0.12.12"
serde = "1.0"
serde_json = "1.0.137"
sha2 = "0.10.8"
tempfile = "3.10.0"
tendermint = "0.40.0"
tendermint-rpc = "0.40.0"
tokio = "1.43"
tracing = { version = "0.1", default-features = false }
url = "2.5.4"

[workspace.lints.rust]
warnings = "deny"
