[package]
name = "eld-cli"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line client for an Eld node"
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/eldnetwork/eld-chain"
keywords = ["blockchain", "cli", "tendermint"]
publish = false

[[bin]]
name = "eld-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "cargo", "wrap_help", "env", "string"] }
eld_common = { path = "../common", version = "0.0.1", package = "eld-common" }
eld_client = { path = "../client", version = "0.0.1", package = "eld-client" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
serde_json.workspace = true
hex.workspace = true
base64.workspace = true
bincode.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
tempfile.workspace = true

[lints]
workspace = true
