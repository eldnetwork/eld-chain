[package]
name = "eld-client"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP client, CWD config, wallets, and CLI helpers for Eld"
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/eldnetwork/eld-chain"
documentation = "https://docs.rs/eld-client"
keywords = ["blockchain", "tendermint", "rpc", "http"]
categories = ["cryptocurrency", "network-programming"]
include = [
    "src/**",
    "examples/**",
    "config/*.json.example",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "TYPE_DESIGN.md",
    "CHANGELOG.md",
]
publish = false

[[example]]
name = "query_account"
doc-scrape-examples = true

[[example]]
name = "broadcast_transfer"
doc-scrape-examples = true

[package.metadata.docs.rs]
all-features = false
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
eld_common = { path = "../common", version = "0.0.1", package = "eld-common" }
abci-rs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tendermint.workspace = true
tendermint-rpc = { workspace = true, features = ["http-client"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8"] }
base64.workspace = true
bincode.workspace = true
hex = { workspace = true, features = ["serde"] }
rand.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["json"] }
url.workspace = true
urlencoding = "2.1.3"

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6"

[lints]
workspace = true
