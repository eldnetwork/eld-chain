name: cli

on:
  push:
    tags:
      - "eld-cli-v*.*.*"

# CI only reads the repo. The release job grants contents: write to open a draft.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    # A custom if replaces the default success() check. Keep success() so a
    # failed CI job cannot publish.
    if: success() && startsWith(github.ref, 'refs/tags/eld-cli-v')
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Build eld-cli
        run: cargo build --release --locked -p eld-cli --target ${{ matrix.target }}
      - name: Check version
        run: ./target/${{ matrix.target }}/release/eld-cli --version
      - name: Check dynamic libraries
        if: runner.os == 'Linux'
        run: |
          ldd ./target/${{ matrix.target }}/release/eld-cli
          ! ldd ./target/${{ matrix.target }}/release/eld-cli | grep -q 'not found'
      - uses: actions/upload-artifact@v4
        with:
          name: eld-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/eld-cli
          if-no-files-found: error
          retention-days: 1

  release:
    if: success() && startsWith(github.ref, 'refs/tags/eld-cli-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: eld-cli-*
          merge-multiple: false
      - name: Pack archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          found=0
          for dir in dist/eld-cli-*; do
            [[ -d "$dir" ]] || continue
            target="${dir#dist/eld-cli-}"
            bin="$dir/eld-cli"
            [[ -f "$bin" ]] || { echo "missing binary in $dir" >&2; exit 1; }
            stage="$(mktemp -d)"
            cp "$bin" "$stage/eld-cli"
            chmod 755 "$stage/eld-cli"
            tar -C "$stage" -czf "assets/${TAG}-${target}.tar.gz" eld-cli
            rm -rf "$stage"
            found=1
          done
          [[ "$found" -eq 1 ]]
          (
            cd assets
            sha256sum -- *.tar.gz | LC_ALL=C sort -k2 > sha256sums.txt
          )
          ls -l assets
      - name: Open draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(assets/*)
          [[ ${#assets[@]} -gt 0 ]]
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            echo "Updated existing release $TAG without publishing it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${TAG#eld-cli-v}"
          args=(release create "$TAG" --draft --title "$TAG")
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          prev=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$TAG" ]]; then
              break
            fi
            prev="$candidate"
          done < <(git tag -l 'eld-cli-v*' | LC_ALL=C sort -V)
          if [[ -n "$prev" ]]; then
            args+=(--generate-notes --notes-start-tag "$prev")
          else
            args+=(--notes "Draft build of eld-cli ${TAG}.")
          fi
          gh "${args[@]}" "${assets[@]}"
          echo "Draft release $TAG is ready to review in the GitHub UI." >> "$GITHUB_STEP_SUMMARY"
