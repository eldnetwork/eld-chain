name: cli

on:
  push:
    tags:
      - "eld-cli-v*.*.*"

# CI only reads the repo. The release job grants contents: write to open a draft.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          # GitHub's macOS runners are arm64. Intel is a cross build on that host.
          - runner: macos-15
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Build eld-cli
        run: cargo build --release --locked -p eld-cli --target ${{ matrix.target }}
      - name: Install Rosetta for the Intel macOS binary
        if: matrix.target == 'x86_64-apple-darwin'
        run: arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
      - name: Check version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bin="./target/${{ matrix.target }}/release/eld-cli"
          ver="$("$bin" --version)"
          echo "$ver"
          pkg_ver="${ver##* }"
          case "$TAG" in
            "eld-cli-v${pkg_ver}"|"eld-cli-v${pkg_ver}-"*) ;;
            *)
              echo "tag $TAG does not match binary version $pkg_ver" >&2
              exit 1
              ;;
          esac
      - name: Strip Linux binary
        if: runner.os == 'Linux'
        run: strip ./target/${{ matrix.target }}/release/eld-cli
      - name: Check dynamic libraries
        if: runner.os == 'Linux'
        run: |
          ldd ./target/${{ matrix.target }}/release/eld-cli
          ! ldd ./target/${{ matrix.target }}/release/eld-cli | grep -q 'not found'
      - uses: actions/upload-artifact@v4
        with:
          name: eld-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/eld-cli
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: eld-cli-*
          merge-multiple: false
      - name: Pack archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          found=0
          for dir in dist/eld-cli-*; do
            [[ -d "$dir" ]] || continue
            target="${dir#dist/eld-cli-}"
            bin="$dir/eld-cli"
            [[ -f "$bin" ]] || { echo "missing binary in $dir" >&2; exit 1; }
            stage="$(mktemp -d)"
            cp "$bin" "$stage/eld-cli"
            chmod 755 "$stage/eld-cli"
            tar -C "$stage" -czf "assets/${TAG}-${target}.tar.gz" eld-cli
            rm -rf "$stage"
            found=1
          done
          [[ "$found" -eq 1 ]]
          (
            cd assets
            sha256sum -- *.tar.gz | LC_ALL=C sort -k2 > sha256sums.txt
          )
          ls -l assets
      - name: Open draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(assets/*)
          [[ ${#assets[@]} -gt 0 ]]
          if gh release view "$TAG" >/dev/null 2>&1; then
            draft="$(gh release view "$TAG" --json isDraft -q .isDraft)"
            [[ "$draft" == "true" ]] || { echo "refusing to mutate a published release" >&2; exit 1; }
            gh release upload "$TAG" "${assets[@]}" --clobber
            echo "Updated draft release $TAG without publishing it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${TAG#eld-cli-v}"
          args=(release create "$TAG" --draft --title "$TAG")
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          prev=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$TAG" ]]; then
              break
            fi
            prev="$candidate"
          done < <(git tag -l 'eld-cli-v*' | LC_ALL=C sort -V)
          notes="$(mktemp)"
          if [[ -n "$prev" ]]; then
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$prev" \
              --jq .body > "$notes"
            printf '\n' >> "$notes"
          else
            printf 'Draft build of eld-cli %s.\n\n' "$TAG" > "$notes"
          fi
          printf '%s\n' \
            'macOS binaries are unsigned and not notarized. Gatekeeper will block a browser download until the quarantine attribute is removed.' \
            'Linux binaries need libssl.so.3 (Debian and Ubuntu).' \
            >> "$notes"
          args+=(--notes-file "$notes")
          gh "${args[@]}" "${assets[@]}"
          echo "Draft release $TAG is ready to review in the GitHub UI." >> "$GITHUB_STEP_SUMMARY"
